[package]
name = "kfx-update"
description = "Self-update of the KeeperFX map editor from its GitHub releases"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
kfx-archive = { path = "../kfx-archive" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# the same HTTP client and TLS (rustls) as the Workshop client
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
semver = "1.0.28"
sha2 = "0.10"

[dev-dependencies]
kfx-formats.workspace = true
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
flate2 = "1.1"
tar = { version = "0.4", default-features = false }
