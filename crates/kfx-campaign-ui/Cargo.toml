[package]
name = "kfx-campaign-ui"
description = "Campaign and map pack editor for KeeperFX: model, validation and egui widget"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[dependencies]
kfx-formats.workspace = true
egui = "0.37"
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
# system fallback fonts in the UI test harnesses (game text in any script)
kfx-fonts = { path = "../kfx-fonts" }
egui = { version = "0.37", features = ["default_fonts"] }
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
zip = { version = "2.6.1", default-features = false, features = ["deflate"] }
