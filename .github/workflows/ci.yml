# Check formatting, build release executables and run the tests on Linux, Windows and macOS.
# No secrets, no publishing, read-only token.
# Tests that need a KeeperFX install skip themselves when KFX_INSTALL is not set to a folder
# (they call kfx_formats::testutil::install_dir() and return early), so CI runs without any
# game data.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # No debug info in CI builds: the test build of the whole workspace otherwise fills the
  # runner's disk.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt
          rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check

  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            exe: kfx-editor
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: kfx-editor.exe
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            exe: kfx-editor
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            exe: kfx-editor
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # libasound2-dev: ALSA headers for audio playback (cpal)
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ matrix.name }}-
      - name: Build release
        run: cargo build --release --locked -p kfx-editor --target ${{ matrix.target }} -j 4
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist/kfx-editor-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} dist/kfx-editor-${{ matrix.name }}/
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY.md dist/kfx-editor-${{ matrix.name }}/
      # macOS: also an unsigned application bundle, tarred so the executable bit survives.
      - name: macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="dist/KeeperFX Map Editor.app"
          mkdir -p "$app/Contents/MacOS"
          cp target/${{ matrix.target }}/release/${{ matrix.exe }} "$app/Contents/MacOS/"
          cp packaging/macos/Info.plist "$app/Contents/"
          tar -C dist -czf "dist/kfx-editor-${{ matrix.name }}/KeeperFX Map Editor.app.tar.gz" "KeeperFX Map Editor.app"
      - uses: actions/upload-artifact@v7
        with:
          name: kfx-editor-${{ matrix.name }}
          path: dist/kfx-editor-${{ matrix.name }}
          if-no-files-found: error

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # Window system and ALSA headers for the build; a software Vulkan driver (lavapipe)
          # for the egui_kittest UI tests, which render with wgpu and need an adapter.
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev mesa-vulkan-drivers libvulkan1
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: test-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ matrix.os }}-
      # KFX_INSTALL is unset, so the tests that need a KeeperFX install skip; the game-harness
      # tests only run with KFX_GAME_TEST=1; the egui_kittest tests that render skip without a
      # wgpu adapter. --no-fail-fast: every crate is tested even when one fails.
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast -j 4 -- --test-threads=4
