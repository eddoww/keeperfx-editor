# Build release executables for Linux, Windows and macOS and publish them as a GitHub release.
# Runs when a tag like v0.1.0 is pushed, or by hand for an existing tag.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release (e.g. v0.1.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: System packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libwayland-dev libx11-dev libasound2-dev
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: build-${{ matrix.name }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: build-${{ matrix.name }}-
      - name: Build release
        run: cargo build --release --locked -p kfx-editor --target ${{ matrix.target }} -j 4
      - name: Package
        shell: bash
        run: |
          name="kfx-editor-${TAG}-${{ matrix.name }}"
          bin="target/${{ matrix.target }}/release"
          mkdir -p "stage/$name" out
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY.md "stage/$name/"
          cp -r docs "stage/$name/docs"
          case "${{ runner.os }}" in
            Linux)
              cp "$bin/kfx-editor" "stage/$name/"
              cp packaging/org.keeperfx.MapEditor.desktop packaging/org.keeperfx.MapEditor.mime.xml "stage/$name/"
              # hicolor icons, laid out to be copied into ~/.local/share/icons or /usr/share/icons
              for s in 16 24 32 48 64 128 256 512; do
                mkdir -p "stage/$name/icons/hicolor/${s}x${s}/apps"
                cp "packaging/icons/kfx-editor-$s.png" "stage/$name/icons/hicolor/${s}x${s}/apps/org.keeperfx.MapEditor.png"
              done
              tar -C stage -czf "out/$name.tar.gz" "$name"
              ;;
            Windows)
              # the GUI program (no console window) and the console program for the command line
              cp "$bin/kfx-editor.exe" "$bin/kfx-editor-cli.exe" "stage/$name/"
              (cd stage && 7z a -tzip "../out/$name.zip" "$name" > /dev/null)
              ;;
            macOS)
              # Unsigned application bundle; tarred so the executable bit survives.
              app="stage/$name/KeeperFX Map Editor.app"
              mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
              cp "$bin/kfx-editor" "$app/Contents/MacOS/"
              cp packaging/macos/Info.plist "$app/Contents/"
              cp packaging/icons/kfx-editor.icns "$app/Contents/Resources/"
              cp "$bin/kfx-editor" "stage/$name/"
              tar -C stage -czf "out/$name.tar.gz" "$name"
              ;;
          esac
          ls -la out
      # Windows: the installer from the same staged files, tried before it is published (silent
      # install into a temporary folder, the command line, silent uninstall).
      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:TAG -replace '^v', ''
          $name = "kfx-editor-$env:TAG-${{ matrix.name }}"
          ./packaging/windows/build-installer.ps1 -Version $version -SourceDir "stage\$name" -OutputDir out -OutputBase "$name-setup"
          ./packaging/windows/smoke-test-installer.ps1 -Setup "out\$name-setup.exe" -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      # Every asset, the installer included: the editor's self-update refuses a download that is
      # not listed here.
      - name: Checksums
        run: |
          cd out
          test -n "$(ls kfx-editor-*-windows-x86_64-setup.exe)"
          sha256sum kfx-editor-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # The release notes template (shown in the editor's Updates dialog too, as plain text).
          NOTES: |
            Pre-release build. Needs your own KeeperFX install; the editor ships no game assets. The user manual is in docs/manual in each download.

            **Windows**: `kfx-editor-${{ env.TAG }}-windows-x86_64-setup.exe` installs the editor for your user account (no administrator rights needed) and lets it update itself; `kfx-editor-${{ env.TAG }}-windows-x86_64.zip` is the portable version. Both are unsigned, so Windows SmartScreen warns on first start ("Windows protected your PC"): choose "More info", then "Run anyway".

            **macOS**: the application is unsigned. The first time, right-click (or Control-click) "KeeperFX Map Editor.app" and choose Open, then Open again.

            **Linux**: unpack the archive anywhere and run `kfx-editor`.

            The editor looks for new versions on GitHub once a day (it asks you first) and can install them; every download is checked against `SHA256SUMS.txt` (see docs/manual/updates.md).
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --title "KeeperFX Map Editor $TAG" --prerelease --generate-notes \
              --notes "$NOTES"
          fi
